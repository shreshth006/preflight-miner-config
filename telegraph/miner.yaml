version: '1'
kind: miner
id: 20260828
slug: a1-preflight
protocol: generic
name: PREFLIGHT Infrastructure Signals
description: >
  Deterministic infrastructure and on-chain signals for autonomous systems,
  each read live at question time. TLS verification performs a real handshake
  with chain, hostname and validity checks; URL safety combines redirects,
  headers and threat feeds; DNS records come from two independent DoH
  resolvers; uptime and API health are probed with per-phase timings. Gas,
  balances, transactions, token supply and pinned-block reads come straight
  from public JSON-RPC on Ethereum, Base, Arbitrum, OP Mainnet, Polygon, BNB Chain, Avalanche, Linea, Scroll, Gnosis, zkSync Era, Blast, Mantle, Celo, Sonic and Unichain.
  Prices, TVL, FX, geolocation, papers and CVEs come from named public
  sources, cited in each answer.
base_url: https://preflight-ssl-verification.vercel.app

docs:
  repository: https://github.com/shreshth006/preflight-miner-config

auth:
  type: none

# The example value of 5/s sits below the node's own 10/s default backstop and
# would cap traffic this miner can comfortably serve; the endpoints are
# stateless and scale horizontally.
rate_limit_per_sec: 25
cache_ttl_sec: 0
# Upstream public RPC and DefiLlama blips should not sideline the miner on a
# short burst, and when the breaker does open it should reclose quickly.
circuit_threshold: 8
circuit_cooldown_seconds: 15

# Every endpoint takes the question verbatim as `query` and recovers what it
# needs from it; the optional params let the request builder pass a field
# directly when the question has one.
endpoints:
  - path: /ssl-check
    external_path: /ssl-check
    method: GET
    description: >
      Live TLS certificate verification for a hostname, HTTPS URL or host:port:
      chain trust, hostname match and validity dates from a real handshake.
    intents:
      - SSL_VERIFICATION_CERT
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is the TLS certificate of github.com currently valid and trusted?".
        optional:
          - name: domain
            type: string
            intents: ['*']
            description: Hostname, HTTPS URL or host:port to verify.
          - name: host
            type: string
            intents: ['*']
            description: Hostname.
  - path: /url-scan
    external_path: /url-scan
    method: GET
    description: >
      Safety verdict for one URL. Follows redirects, verifies TLS, inspects
      security headers and checks live threat feeds, with a risk score and findings.
    intents:
      - URL_SCAN_VERDICT
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is the URL https://example.com/ safe to visit, with no phishing or malware?".
        optional:
          - name: url
            type: string
            intents: ['*']
            description: Absolute URL to assess.
  - path: /gas-price
    external_path: /gas-price
    method: GET
    description: >
      Current gas price for an EVM chain, with EIP-1559 base fee, suggested
      priority fee and the cost of a standard native transfer.
    intents:
      - GAS_PRICE_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the gas price on Base right now?".
        optional:
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
  - path: /wallet-balance
    external_path: /wallet-balance
    method: GET
    description: >
      Native token balance of an EVM address, with nonce and account type
      including EIP-7702 delegated accounts.
    intents:
      - WALLET_BALANCE_CHECK_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "How much ETH does 0x00000000219ab540356cBB839Cbe05303d7705Fa hold?".
        optional:
          - name: address
            type: string
            intents: ['*']
            description: 0x-prefixed EVM address.
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
          - name: token
            type: string
            intents: ['*']
            description: Token symbol or contract address; empty for the chain's native coin.
  - path: /tx-lookup
    external_path: /tx-lookup
    method: GET
    description: >
      Status and effect of a transaction hash: decoded token transfers, sender
      and recipient, confirmations, gas and full fee, and whether amounts or
      addresses the question claims match the receipt.
    intents:
      - ONCHAIN_TX_LOOKUP_GENERAL
      - CRYPTO_TRANSFER_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Did transaction 0x... on Ethereum succeed, and what fee did it pay?".
        optional:
          - name: hash
            type: string
            intents: ['*']
            description: 0x-prefixed 32-byte transaction hash.
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
          - name: tx_hash
            type: string
            intents: [ONCHAIN_TX_LOOKUP_GENERAL]
            description: Transaction hash.
  - path: /crypto-price
    external_path: /crypto-price
    method: GET
    description: >
      Current US dollar spot price of a cryptocurrency, by ticker or name,
      aggregated by DefiLlama with the observation timestamp (field price_usd).
    intents:
      - CRYPTO_PRICE_USD
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the current price of BTC in US dollars?".
        optional:
          - name: asset
            type: string
            intents: ['*']
            description: Cryptocurrency ticker or name, for example BTC or ethereum.
          - name: symbol
            type: string
            intents: ['*']
            description: Asset symbol, e.g. BTC.
  - path: /tvl
    external_path: /tvl
    method: GET
    description: >
      Total value locked of a DeFi protocol or chain, mirrored from DefiLlama.
    intents:
      - TVL_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the TVL of Aave right now?".
        optional:
          - name: protocol
            type: string
            intents: ['*']
            description: DeFi protocol or chain name.
  - path: /fx-rate
    external_path: /fx-rate
    method: GET
    description: >
      Mid-market exchange rate between two currencies, named as ISO 4217 codes
      or common names, with the inverse rate and, when an amount is asked, the converted amount.
    intents:
      - CURRENCY_EXCHANGE_CONVERT
      - FX_NOW_EUR
      - FX_NOW_CAD
      - FX_NOW_SEK
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "How much is 100 US dollars in EUR right now?".
        optional:
          - name: from
            type: string
            intents: ['*']
            description: Source currency, ISO 4217 code such as USD.
          - name: to
            type: string
            intents: ['*']
            description: Target currency, ISO 4217 code such as EUR.
          - name: amount
            type: number
            intents: ['*']
            description: Amount of the source currency to convert, when the question names one.
          - name: from_currency
            type: string
            intents: [CURRENCY_EXCHANGE_CONVERT]
            description: Currency code to convert from, e.g. USD.
          - name: to_currency
            type: string
            intents: [CURRENCY_EXCHANGE_CONVERT]
            description: Currency code to convert into, e.g. EUR.
          - name: currency
            type: string
            intents: [FX_NOW_EUR, FX_NOW_CAD, FX_NOW_SEK]
            description: Currency code priced against the US dollar, e.g. EUR.
  - path: /ip-geolocation
    external_path: /ip-geolocation
    method: GET
    description: >
      Geolocation of an IPv4 or IPv6 address, with city, region, country,
      coordinates, timezone, ISP and autonomous system.
    intents:
      - IP_GEOLOCATION_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Where is the IP address 8.8.8.8 located?".
        optional:
          - name: ip
            type: string
            intents: ['*']
            description: IPv4 or IPv6 address to locate.
  - path: /stock-price
    external_path: /stock-price
    method: GET
    description: >
      Current share price of a listed equity by ticker or company name, with
      the previous close, the day's change and the listing venue.
    intents:
      - STOCK_PRICE_US_EQUITY
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the current share price of AAPL in US dollars?".
        optional:
          - name: symbol
            type: string
            intents: ['*']
            description: Equity ticker or company name, for example AAPL.
          - name: ticker
            type: string
            intents: ['*']
            description: Stock ticker, e.g. AAPL.
  - path: /papers
    external_path: /papers
    method: GET
    description: >
      Peer-reviewed papers for a research question, optionally constrained by
      publication dates, result count and citation or recency ordering, from OpenAlex.
    intents:
      - ACADEMIC_SEARCH_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Find the five most cited papers on transformer models published since 2020.".
  - path: /cve
    external_path: /cve
    method: GET
    description: >
      Vulnerability details for a CVE identifier: severity, CVSS v3 base score,
      affected versions and known-exploitation status, from CVE.org and NVD.
    intents:
      - CVE_LOOKUP_CVSS
      - VULNERABILITY_TRIAGE_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the CVSS v3 base score of CVE-2021-44228?".
        optional:
          - name: cve_id
            type: string
            intents: ['*']
            description: CVE identifier such as CVE-2021-44228.
  - path: /dns
    external_path: /dns
    method: GET
    description: >
      DNS records of a name (A, AAAA, CNAME, MX, TXT, NS, SOA, CAA), resolved
      independently by Cloudflare and Google DNS-over-HTTPS, with whether they agree.
    intents:
      - DNS_RECORD_LOOKUP_GENERAL
      - EMAIL_SECURITY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What are the MX records for gmail.com?".
        optional:
          - name: domain
            type: string
            intents: ['*']
            description: Domain or hostname to resolve.
          - name: type
            type: string
            intents: ['*']
            description: Record type, for example MX, TXT or AAAA. Several types may be comma-separated.
          - name: name
            type: string
            intents: ['*']
            description: Domain name.
          - name: record_type
            type: string
            intents: ['*']
            description: DNS record type. One of A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, SRV, PTR.
  - path: /token-supply
    external_path: /token-supply
    method: GET
    description: >
      ERC-20 total supply read from totalSupply() at the latest or a pinned block,
      with burn-address holdings and, when asked, the circulating figure.
    intents:
      - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the total supply of USDC on Base right now?".
        optional:
          - name: token
            type: string
            intents: ['*']
            description: Token symbol or 0x contract address.
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
          - name: block
            type: integer
            intents: ['*']
            description: Block number to read at, when the question pins one.
  - path: /onchain-metric
    external_path: /onchain-metric
    method: GET
    description: >
      Verifiable on-chain read: native or ERC-20 balance, token metadata, a storage
      slot or transfer activity, at the latest or a pinned block.
    intents:
      - ONCHAIN_METRIC_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What was the USDC balance of 0x... on Ethereum at block 21,000,000?".
        optional:
          - name: address
            type: string
            intents: ['*']
            description: 0x-prefixed account or contract address.
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
          - name: block
            type: integer
            intents: ['*']
            description: Block number to read at, when the question pins one.
  - path: /url-safe
    external_path: /url-safe
    method: GET
    description: >
      Whether a URL or domain is listed in live threat feeds (URLhaus, OpenPhish)
      and blocked by Cloudflare's security resolver, naming every source that flags it.
    intents:
      - URL_SAFE_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is https://login-secure-update.example.com listed for phishing in threat feeds?".
        optional:
          - name: url
            type: string
            intents: ['*']
            description: URL or domain to check.
  - path: /uptime
    external_path: /uptime
    method: GET
    description: >
      Availability of an HTTP(S) endpoint from two probes, with DNS, TCP, TLS and
      server-response timings, measured from one location (stated in the answer).
    intents:
      - SERVER_UPTIME_MONITOR_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is https://github.com up right now? Give me the response time breakdown.".
        optional:
          - name: url
            type: string
            intents: ['*']
            description: Absolute URL or hostname to probe.
  - path: /api-health
    external_path: /api-health
    method: GET
    description: >
      Health of a REST or GraphQL endpoint: status code, latency, content type and
      the structure of the JSON payload; GraphQL endpoints get a {__typename} query.
    intents:
      - API_HEALTH_CHECK_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is the API at https://api.github.com/ healthy?".
        optional:
          - name: url
            type: string
            intents: ['*']
            description: Absolute URL of the API endpoint.

  - path: /liquidity
    external_path: /liquidity
    method: GET
    description: >
      Order-book depth for a trading pair on Coinbase Exchange or Kraken: best
      bid and ask, spread, depth within 1% and 2% of mid, and the average fill
      and slippage of a stated market order size.
    intents:
      - LIQUIDITY_DEPTH_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What slippage would a 50 ETH market sell take on Coinbase ETH-USD?".
        optional:
          - name: pool
            type: string
            intents: ['*']
            description: DEX pool address or name.
          - name: chain
            type: string
            intents: ['*']
            description: Chain of the pool.
  - path: /yield
    external_path: /yield
    method: GET
    description: >
      APY of a DeFi pool named by protocol, asset and chain from DefiLlama's
      yields index, split into base and reward yield, with the 30-day mean.
    intents:
      - CRYPTO_YIELD_RATE_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What APY does the USDC pool on aave-v3 on Arbitrum pay?".
        optional:
          - name: project
            type: string
            intents: ['*']
            description: Lending protocol, e.g. aave-v3.
          - name: symbol
            type: string
            intents: ['*']
            description: Asset of the pool, e.g. USDC.
          - name: chain
            type: string
            intents: ['*']
            description: Chain of the pool, e.g. Ethereum.
  - path: /holders
    external_path: /holders
    method: GET
    description: >
      Number of distinct addresses holding an ERC-20 token, by contract address
      or symbol, from the chain's Blockscout index.
    intents:
      - TOKEN_HOLDER_COUNT_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "How many addresses hold USDC (0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48) on Ethereum?".
        optional:
          - name: chain
            type: string
            intents: ['*']
            description: EVM chain name or chain ID - ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, linea, scroll, gnosis, zksync, blast, mantle, celo, sonic or unichain. Defaults to ethereum.
          - name: token
            type: string
            intents: ['*']
            description: Token contract address or name.
  - path: /weather
    external_path: /weather
    method: GET
    description: >
      Current air temperature for a named place, plus the forecast high, low, rain chance,
      gusts, precipitation and a graded storm risk over the asked window. The temperature is the
      median of Open-Meteo, MET Norway and the nearest fresh NOAA METAR; the forecast is Open-Meteo.
    intents:
      - WEATHER_CHECK_TEMPERATURE
      - WEATHER_FORECAST_GENERAL
      - STORM_ALERT_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the current air temperature in Karachi, in degrees Celsius?".
        optional:
          - name: location
            type: string
            intents: ['*']
            description: City or place name, optionally with its country or US state, or latitude,longitude.
          - name: window_hours
            type: integer
            intents: [WEATHER_FORECAST_GENERAL, STORM_ALERT_GENERAL]
            description: Forecast window in hours, 1 to 240. Defaults to 24.
  - path: /macro
    external_path: /macro
    method: GET
    description: >
      A World Bank development indicator for a country and year: unemployment (% of labour
      force) by default, also inflation, GDP growth and labour-force participation.
    intents:
      - MACRO_ECONOMIC_INDICATOR_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What was the unemployment rate in Germany in 2023?".
        optional:
          - name: indicator
            type: string
            intents: ['*']
            description: The indicator, for example unemployment rate.
          - name: country
            type: string
            intents: ['*']
            description: Country name or ISO code.
          - name: year
            type: integer
            intents: ['*']
            description: Year, 1960 onwards. Defaults to the latest reported.
  - path: /validator
    external_path: /validator
    method: GET
    description: >
      Status, balance and effective balance (gwei) of an Ethereum beacon-chain validator at
      the head state, from public beacon APIs.
    intents:
      - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What is the effective balance of beacon-chain validator 500000?".
        optional:
          - name: validator_index
            type: integer
            intents: ['*']
            description: Ethereum beacon-chain validator index.
  - path: /reserve
    external_path: /reserve
    method: GET
    description: >
      Reserve attested by a Chainlink proof-of-reserve feed for a tokenized asset (WBTC, cbBTC,
      stETH, TUSD, LBTC, eETH, FBTC, SolvBTC, uniBTC), beside its total supply at the same block.
    intents:
      - ASSET_RESERVE_ATTESTATION_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What reserve does Chainlink proof of reserve attest for WBTC?".
        optional:
          - name: asset
            type: string
            intents: ['*']
            description: The tokenized asset, by symbol or Ethereum contract address.
  - path: /hashprice
    external_path: /hashprice
    method: GET
    description: >
      Bitcoin hashprice at a block height in sats and USD per PH/s per day, from that block's
      difficulty and miner reward (subsidy plus fees) on mempool.space.
    intents:
      - MINING_HASHPRICE_VERIFY_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "What was the Bitcoin hashprice at block height 850000?".
        optional:
          - name: block_height
            type: integer
            intents: ['*']
            description: Bitcoin block height. Defaults to the chain tip.
  - path: /company
    external_path: /company
    method: GET
    description: >
      Legal-entity registration from GLEIF's global LEI index: legal name, LEI, jurisdiction,
      registered address, creation date and whether the entity is active.
    intents:
      - CORPORATE_REGISTRY_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is Siemens AG an active company in Germany?".
        optional:
          - name: company
            type: string
            intents: ['*']
            description: Company name or LEI.
          - name: jurisdiction
            type: string
            intents: ['*']
            description: Country or jurisdiction of registration.
  - path: /threat-intel
    external_path: /threat-intel
    method: GET
    description: >
      Whether an IPv4 address, domain or URL is reported in public threat feeds: Spamhaus DROP,
      FireHOL level 1, abuse.ch Feodo, blocklist.de, Emerging Threats, CINS and the Tor exit list
      for IPs; OpenPhish and Cloudflare security DNS for domains and URLs.
    intents:
      - THREAT_INTELLIGENCE_INDICATOR
      - THREAT_IP_REPUTATION_GENERAL
    params:
      query:
        required:
          - name: query
            type: string
            intents: ['*']
            description: >
              The full question in plain language, kept verbatim, for example
              "Is 185.220.101.4 reported as malicious in public threat-intelligence feeds?".
        optional:
          - name: indicator
            type: string
            intents: ['*']
            description: The IPv4 address, domain or URL to check.
  - path: /sanctions
    external_path: /sanctions
    method: GET
    description: >
      Screens a person, entity or wallet address against the OFAC SDN list, the OFAC consolidated
      (non-SDN) list and the UN Security Council consolidated list: exact matches for listed
      digital-currency addresses, fuzzy name matching with aliases, the best score and the lists checked.
